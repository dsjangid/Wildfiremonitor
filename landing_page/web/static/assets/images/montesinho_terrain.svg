<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="parkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b242a"/>
      <stop offset="100%" stop-color="#050e14"/>
    </radialGradient>
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#parkBg)"/>
  <!-- Topographic Contour Lines -->
  <path d="M50 250 Q150 120 250 200 T450 180" fill="none" stroke="url(#contourGrad)" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M40 320 Q180 200 280 280 T460 270" fill="none" stroke="url(#contourGrad)" stroke-width="1.5"/>
  <path d="M80 400 Q200 310 320 380 T480 360" fill="none" stroke="url(#contourGrad)" stroke-width="1.5" stroke-dasharray="6,3"/>
  <path d="M120 120 Q220 50 340 100 T460 90" fill="none" stroke="url(#contourGrad)" stroke-width="1.2"/>
  <ellipse cx="250" cy="240" rx="90" ry="60" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.5"/>
  <ellipse cx="250" cy="240" rx="45" ry="30" fill="none" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- 9x9 Grid Coordinate Lines Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="55" y1="50" x2="55" y2="450"/>
    <line x1="105" y1="50" x2="105" y2="450"/>
    <line x1="155" y1="50" x2="155" y2="450"/>
    <line x1="205" y1="50" x2="205" y2="450"/>
    <line x1="250" y1="50" x2="250" y2="450"/>
    <line x1="295" y1="50" x2="295" y2="450"/>
    <line x1="345" y1="50" x2="345" y2="450"/>
    <line x1="395" y1="50" x2="395" y2="450"/>
    <line x1="445" y1="50" x2="445" y2="450"/>

    <line x1="50" y1="55" x2="450" y2="55"/>
    <line x1="50" y1="105" x2="450" y2="105"/>
    <line x1="50" y1="155" x2="450" y2="155"/>
    <line x1="50" y1="205" x2="450" y2="205"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="50" y1="295" x2="450" y2="295"/>
    <line x1="50" y1="345" x2="450" y2="345"/>
    <line x1="50" y1="395" x2="450" y2="395"/>
    <line x1="50" y1="445" x2="450" y2="445"/>
