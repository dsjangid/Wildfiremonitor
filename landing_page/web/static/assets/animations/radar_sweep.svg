<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sweep-arm {
      transform-origin: 100px 100px;
      animation: spin 4s linear infinite;
    }
  </style>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="5" y1="100" x2="195" y2="100" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="100" y1="5" x2="100" y2="195" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.3"/>
  <g class="sweep-arm">
    <path d="M100 100 L195 100 A95 95 0 0 0 170 30 Z" fill="url(#radarSweepGrad)"/>
    <line x1="100" y1="100" x2="195" y2="100" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
